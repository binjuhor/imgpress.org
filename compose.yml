services:
  app:
    container_name: imgpress
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SERVER_TIMEOUT_MS=300000
      - KEEP_ALIVE_TIMEOUT_MS=360000
      - HEADERS_TIMEOUT_MS=361000
      - MAX_IMAGE_SIDE_PX=20000
      - MAX_IMAGE_MEGAPIXELS=200
      - MAX_FILE_SIZE_MB=50
      - MAX_FILES=20
      - DEFAULT_QUALITY=80
      - DEFAULT_WIDTH=1600
      - COMPRESS_TIMEOUT_MS=300000
      - MAX_QUALITY_NO_ALPHA=85
      - MAX_QUALITY_WITH_ALPHA=90
      - DITHER_MAX=0.7
      - DITHER_MIN=0.3
      - SHARP_CONCURRENCY=0
      - JOB_TTL_MS=3600000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=imgpress
      - DB_USER=imgpress
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - ADMIN_KEY=${ADMIN_KEY:-changeme}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - caddy
      - internal

  db:
    image: mariadb:11
    container_name: imgpress-db
    environment:
      MARIADB_DATABASE: imgpress
      MARIADB_USER: imgpress
      MARIADB_PASSWORD: ${DB_PASSWORD:-changeme}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
    volumes:
      - ./db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - internal

networks:
  caddy:
    external: true
  internal:
    driver: bridge
