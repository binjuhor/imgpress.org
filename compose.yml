services:
  app:
    container_name: imgpress
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SERVER_TIMEOUT_MS=300000
      - KEEP_ALIVE_TIMEOUT_MS=360000
      - HEADERS_TIMEOUT_MS=361000
      - MAX_IMAGE_SIDE_PX=20000
      - MAX_IMAGE_MEGAPIXELS=200
      - MAX_FILE_SIZE_MB=50
      - MAX_FILES=20
      - DEFAULT_QUALITY=80
      - DEFAULT_WIDTH=1600
      - COMPRESS_TIMEOUT_MS=300000
      - MAX_QUALITY_NO_ALPHA=85
      - MAX_QUALITY_WITH_ALPHA=90
      - DITHER_MAX=0.7
      - DITHER_MIN=0.3
      - SHARP_CONCURRENCY=0
      - JOB_TTL_MS=3600000
    restart: unless-stopped
